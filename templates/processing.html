<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing PDF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .container {
            width: 90%; 
            max-width: 700px; 
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #0d6efd; /* Bootstrap primary blue */
            margin-bottom: 25px;
        }
        .progress-container { 
            width: 100%; 
            background-color: #e9ecef; 
            border-radius: 25px; 
            margin-bottom: 20px; 
            overflow: hidden; /* Ensures inner bar respects border radius */
            border: 1px solid #ced4da;
        }
        .progress-bar { 
            width: 0%; 
            height: 35px; 
            background-color: #0d6efd; /* Bootstrap primary blue */
            text-align: center; 
            line-height: 35px; 
            color: white; 
            font-weight: bold;
            border-radius: 25px 0 0 25px; /* Rounded on the left */
            transition: width 0.5s ease-in-out, background-color 0.5s ease; 
        }
        .progress-bar.completed {
            background-color: #198754; /* Bootstrap success green */
            border-radius: 25px; /* Fully rounded when complete */
        }
        .progress-bar.error {
            background-color: #dc3545; /* Bootstrap danger red */
            border-radius: 25px; /* Fully rounded on error */
        }
        .status-message { 
            margin-bottom: 25px; 
            font-size: 1.1em; 
            color: #495057;
            min-height: 2em; /* Reserve space to avoid layout jumps */
        }
        .download-links a, .action-links a { 
            display: inline-block; 
            margin-top: 15px;
            margin-right: 10px;
            padding: 12px 20px; 
            background-color: #0d6efd; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-size: 1em;
            transition: background-color 0.2s ease;
        }
        .download-links a:hover, .action-links a:hover { 
            background-color: #0b5ed7; 
        }
        .action-links a.secondary {
            background-color: #6c757d; /* Bootstrap secondary */
        }
        .action-links a.secondary:hover {
            background-color: #5a6268;
        }
        .error-message { 
            color: #dc3545; 
            font-weight: bold; 
            margin-top: 15px;
        }
        .spinner-border {
            width: 1.5rem;
            height: 1.5rem;
            margin-left: 10px;
            vertical-align: text-bottom;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Processing Your PDF</h1>
        
        <div class="status-message" id="statusMessage">
            Initializing... 
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
        </div>

        <div class="download-links" id="downloadLinks"></div>
        <div class="action-links" id="actionLinks"></div>
        <div class="error-message" id="errorMessage"></div>
    </div>

    <script>
        const taskId = "{{ session.get('current_task_id', 'null') }}";
        const progressBar = document.getElementById('progressBar');
        const statusMessage = document.getElementById('statusMessage');
        const downloadLinksDiv = document.getElementById('downloadLinks');
        const actionLinksDiv = document.getElementById('actionLinks');
        const errorMessageDiv = document.getElementById('errorMessage');
        const spinner = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>';

        function updateStatus(message, showSpinner = true) {
            statusMessage.innerHTML = message + (showSpinner ? ' ' + spinner : '');
        }

        function updateProgress() {
            if (taskId === 'null') {
                updateStatus("Error: No task ID found. Cannot track progress.", false);
                errorMessageDiv.textContent = "Please try uploading your file again.";
                progressBar.style.width = '100%';
                progressBar.textContent = 'Error';
                progressBar.classList.add('error');
                addHomeLink("Try Uploading Again");
                return;
            }

            fetch(`/progress/${taskId}`)
                .then(response => {
                    if (!response.ok) {
                        // Handle HTTP errors like 404 if task ID is invalid after some time
                        throw new Error(`Server responded with ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    updateStatus(data.message || 'Processing...', data.status === 'processing' || data.status === 'initializing');
                    
                    const percentage = data.percentage || 0;
                    progressBar.style.width = percentage + '%';
                    progressBar.textContent = percentage + '%';
                    progressBar.setAttribute('aria-valuenow', percentage);

                    if (data.status === 'completed') {
                        clearInterval(intervalId);
                        progressBar.classList.add('completed');
                        updateStatus(data.message || "Processing complete!", false);
                        
                        if (data.result && data.result.length > 0) {
                            data.result.forEach(fileInfo => {
                                const link = document.createElement('a');
                                link.href = `/download/${fileInfo.name}`;
                                link.textContent = `Download ${fileInfo.name}`;
                                link.setAttribute('download', fileInfo.name);
                                downloadLinksDiv.appendChild(link);
                            });
                        } else {
                             downloadLinksDiv.innerHTML = "<p>No files were generated, or an issue occurred during file creation.</p>";
                        }
                        addHomeLink("Process Another File");

                    } else if (data.status === 'error') {
                        clearInterval(intervalId);
                        progressBar.classList.add('error');
                        updateStatus(`Error: ${data.message}`, false);
                        errorMessageDiv.textContent = data.message || "An unspecified error occurred.";
                        addHomeLink("Try Again");
                    }
                })
                .catch(error => {
                    console.error('Error fetching progress:', error);
                    updateStatus('Error fetching progress. Please check console or try again.', false);
                    errorMessageDiv.textContent = 'Could not retrieve progress. The server might be busy or the task may have expired.';
                    progressBar.style.width = '100%';
                    progressBar.textContent = 'Connection Error';
                    progressBar.classList.add('error');
                    clearInterval(intervalId);
                    addHomeLink("Back to Home");
                });
        }

        function addHomeLink(text) {
            actionLinksDiv.innerHTML = ''; // Clear previous links
            const homeLink = document.createElement('a');
            homeLink.href = "{{ url_for('index') }}"; // Make sure 'index' is your main page route
            homeLink.textContent = text;
            homeLink.classList.add('secondary');
            actionLinksDiv.appendChild(homeLink);
        }

        let intervalId;
        if (taskId && taskId !== 'null') {
            updateStatus("Connecting to task...");
            intervalId = setInterval(updateProgress, 2500); // Poll every 2.5 seconds
            updateProgress(); // Initial call to get status immediately
        } else {
            updateStatus("Error: Task ID is missing. Cannot track progress.", false);
            progressBar.style.width = '100%';
            progressBar.textContent = 'Error - No Task ID';
            progressBar.classList.add('error');
            addHomeLink("Return to Upload Page");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
