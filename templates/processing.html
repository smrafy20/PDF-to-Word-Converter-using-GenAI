<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing PDF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Simple, Professional & Vintage Color Palette */
            --primary-color: #2c3e50; /* Dark blue/slate */
            --primary-dark: #1a252f; /* Darker shade */
            --secondary-color: #f8f9fa; /* Very light gray for body background */
            --accent-color: #7f8c8d; /* Neutral gray accent */
            --text-color: #333333; /* Dark gray for text */
            --text-light: #6c757d; /* Medium gray for subtitles/muted text */
            --success-color: #2c3e50; /* Match primary color */
            --danger-color: #6c757d;  /* Gray for errors */
            
            /* Light Theme Variables */
            --body-bg: var(--secondary-color);
            --container-bg: #ffffff;
            --container-shadow: 0 .2rem 1.5rem 0 rgba(0, 0, 0, .08);
            --progress-container-bg: #f1f1f1;
            --progress-container-border: #e0e0e0;
            --status-text: var(--text-color);
            
            /* Button colors */
            --btn-primary-bg: var(--primary-color);
            --btn-primary-hover-bg: var(--primary-dark);
            --btn-secondary-bg: #6c757d;
            --btn-secondary-hover-bg: #5a6268;
        }

        body.dark-mode {
            --primary-color: #34495e; /* Mid dark blue/slate */
            --primary-dark: #2c3e50;
            --secondary-color: #1a1a1a; /* Very dark gray for background */
            --accent-color: #7f8c8d; 
            --text-color: #ecf0f1; /* Light gray for text */
            --text-light: #bdc3c7; /* Light gray for muted text */
            --success-color: #34495e;
            --danger-color: #95a5a6;
            
            --body-bg: var(--secondary-color);
            --container-bg: #2c2c2c;
            --container-shadow: 0 .2rem 1.5rem 0 rgba(0,0,0,.2);
            --progress-container-bg: #252525;
            --progress-container-border: #3d3d3d;
            --status-text: var(--text-color);
            
            /* Button colors for dark mode */
            --btn-primary-bg: var(--primary-color);
            --btn-primary-hover-bg: var(--primary-dark);
            --btn-secondary-bg: #566573;
            --btn-secondary-hover-bg: #4A5763;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--body-bg);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .theme-toggler {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1000;
            background-color: var(--container-bg);
            color: var(--text-color);
            border: 1px solid var(--progress-container-border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggler:hover {
            background-color: var(--primary-color);
            color: var(--container-bg) !important; 
            border-color: var(--primary-dark);
        }

        .container {
            width: 90%; 
            max-width: 700px; 
            background-color: var(--container-bg);
            padding: 30px 40px;
            border-radius: 0.25rem;
            box-shadow: var(--container-shadow);
            text-align: center;
            transition: background-color 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
        }
        
        h1 {
            color: var(--primary-color);
            font-family: 'Roboto Slab', serif;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }
        
        .progress-container { 
            width: 100%; 
            background-color: var(--progress-container-bg); 
            border-radius: 0.25rem; 
            margin-bottom: 20px; 
            overflow: hidden; 
            border: 1px solid var(--progress-container-border);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .progress-bar { 
            width: 0%; 
            height: 30px; 
            background-color: var(--primary-color); 
            text-align: center; 
            line-height: 30px; 
            color: white; 
            font-weight: 500;
            border-radius: 0.25rem 0 0 0.25rem; 
            transition: width 0.5s ease-in-out, background-color 0.5s ease; 
        }
        
        .progress-bar.completed {
            background-color: var(--success-color);
            border-radius: 0.25rem; 
        }
        
        .progress-bar.error {
            background-color: var(--danger-color);
            border-radius: 0.25rem; 
        }
        
        .status-message { 
            margin-bottom: 25px; 
            font-size: 1rem; 
            color: var(--status-text);
            min-height: 2em; 
            transition: color 0.3s ease;
            font-family: 'Roboto', sans-serif;
        }
        
        .download-links a, .action-links a { 
            display: inline-block; 
            margin-top: 15px;
            margin-right: 10px;
            padding: 0.75rem 1.5rem; 
            background-color: var(--btn-primary-bg); 
            color: white; 
            text-decoration: none; 
            border-radius: 0.25rem; 
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }
        
        .download-links a:hover, .action-links a:hover { 
            background-color: var(--btn-primary-hover-bg); 
        }
        
        .action-links a.secondary {
            background-color: var(--btn-secondary-bg); 
        }
        
        .action-links a.secondary:hover {
            background-color: var(--btn-secondary-hover-bg);
        }
        
        .error-message { 
            color: var(--danger-color); 
            font-weight: 500; 
            margin-top: 15px;
            font-family: 'Roboto', sans-serif;
        }
        
        .spinner-border {
            width: 1.5rem;
            height: 1.5rem;
            margin-left: 10px;
            vertical-align: text-bottom;
            color: var(--primary-color) !important;
        }
    </style>
</head>
<body>
    <button id="theme-toggle-btn" class="btn theme-toggler" title="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>
    <div class="container">
        <h1>Processing Your PDF</h1>
        
        <div class="status-message" id="statusMessage">
            Initializing... 
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
        </div>

        <div class="download-links" id="downloadLinks"></div>
        <div class="action-links" id="actionLinks"></div>
        <div class="error-message" id="errorMessage"></div>
    </div>

    <script>
        const taskId = "{{ session.get('current_task_id', 'null') }}";
        const progressBar = document.getElementById('progressBar');
        const statusMessage = document.getElementById('statusMessage');
        const downloadLinksDiv = document.getElementById('downloadLinks');
        const actionLinksDiv = document.getElementById('actionLinks');
        const errorMessageDiv = document.getElementById('errorMessage');
        const spinner = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>';

        function updateStatus(message, showSpinner = true) {
            statusMessage.innerHTML = message + (showSpinner ? ' ' + spinner : '');
        }

        function updateProgress() {
            if (taskId === 'null') {
                updateStatus("Error: No task ID found. Cannot track progress.", false);
                errorMessageDiv.textContent = "Please try uploading your file again.";
                progressBar.style.width = '100%';
                progressBar.textContent = 'Error';
                progressBar.classList.add('error');
                addHomeLink("Try Uploading Again");
                return;
            }

            fetch(`/progress/${taskId}`)
                .then(response => {
                    if (!response.ok) {
                        // Handle HTTP errors like 404 if task ID is invalid after some time
                        throw new Error(`Server responded with ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    updateStatus(data.message || 'Processing...', data.status === 'processing' || data.status === 'initializing');
                    
                    const percentage = data.percentage || 0;
                    progressBar.style.width = percentage + '%';
                    progressBar.textContent = percentage + '%';
                    progressBar.setAttribute('aria-valuenow', percentage);

                    if (data.status === 'completed') {
                        clearInterval(intervalId);
                        progressBar.classList.add('completed');
                        updateStatus(data.message || "Processing complete!", false);
                        
                        if (data.result && data.result.length > 0) {
                            data.result.forEach(fileInfo => {
                                const link = document.createElement('a');
                                link.href = `/download/${fileInfo.name}`;
                                link.textContent = `Download ${fileInfo.name}`;
                                link.setAttribute('download', fileInfo.name);
                                downloadLinksDiv.appendChild(link);
                            });
                        } else {
                             downloadLinksDiv.innerHTML = "<p>No files were generated, or an issue occurred during file creation.</p>";
                        }
                        addHomeLink("Process Another File");

                    } else if (data.status === 'error') {
                        clearInterval(intervalId);
                        progressBar.classList.add('error');
                        updateStatus(`Error: ${data.message}`, false);
                        errorMessageDiv.textContent = data.message || "An unspecified error occurred.";
                        addHomeLink("Try Again");
                    }
                })
                .catch(error => {
                    console.error('Error fetching progress:', error);
                    updateStatus('Error fetching progress. Please check console or try again.', false);
                    errorMessageDiv.textContent = 'Could not retrieve progress. The server might be busy or the task may have expired.';
                    progressBar.style.width = '100%';
                    progressBar.textContent = 'Connection Error';
                    progressBar.classList.add('error');
                    clearInterval(intervalId);
                    addHomeLink("Back to Home");
                });
        }

        function addHomeLink(text) {
            actionLinksDiv.innerHTML = ''; // Clear previous links
            const homeLink = document.createElement('a');
            homeLink.href = "{{ url_for('index') }}"; // Make sure 'index' is your main page route
            homeLink.textContent = text;
            homeLink.classList.add('secondary');
            actionLinksDiv.appendChild(homeLink);
        }

        let intervalId;
        if (taskId && taskId !== 'null') {
            updateStatus("Connecting to task...");
            intervalId = setInterval(updateProgress, 2500); // Poll every 2.5 seconds
            updateProgress(); // Initial call to get status immediately
        } else {
            updateStatus("Error: Task ID is missing. Cannot track progress.", false);
            progressBar.style.width = '100%';
            progressBar.textContent = 'Error - No Task ID';
            progressBar.classList.add('error');
            addHomeLink("Return to Upload Page");
        }

        // Theme toggler script
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const bodyElement = document.body;
        const themeIcon = themeToggleBtn.querySelector('i');

        function applyProcessingTheme(theme) {
            if (theme === 'dark') {
                bodyElement.classList.add('dark-mode');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                bodyElement.classList.remove('dark-mode');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        }

        const currentSavedTheme = localStorage.getItem('theme');
        if (currentSavedTheme) {
            applyProcessingTheme(currentSavedTheme);
        } else {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                applyProcessingTheme('dark');
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            if (bodyElement.classList.contains('dark-mode')) {
                applyProcessingTheme('light');
                localStorage.setItem('theme', 'light');
            } else {
                applyProcessingTheme('dark');
                localStorage.setItem('theme', 'dark');
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
